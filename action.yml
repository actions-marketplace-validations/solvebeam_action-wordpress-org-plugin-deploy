name: 'SolveBeam WordPress.org Plugin Deploy'
description: 'Deploy the exact ZIP from your GitHub release to the WordPress.org plugin directory. Checks first, never rebuilds.'
author: 'SolveBeam'

branding:
  icon: 'upload-cloud'
  color: 'orange'

inputs:
  username:
    description: >
      WordPress plugin directory Subversion username, remember your username is case sensitive.

      https://developer.wordpress.org/plugins/wordpress-org/how-to-use-subversion/
    required: true
  password:
    description: >
      WordPress plugin directory Subversion password.

      If you need to reset your password, go to [login.wordpress.org](https://login.wordpress.org/).

      https://developer.wordpress.org/plugins/wordpress-org/how-to-use-subversion/
    required: true
  tag:
    description: >
      Release tag name, with or without a leading `v`.

      The GitHub release with this tag must contain a `{slug}.{version}.zip` asset and the version must be equal to the stable tag in the `readme.txt` file of the plugin.

      https://docs.github.com/en/repositories/releasing-projects-on-github/about-releases
    required: true
  slug:
    description: >
      WordPress plugin slug.

      https://developer.wordpress.org/plugins/wordpress-org/plugin-developer-faq/#what-will-my-plugin-permalink-slug-be
    required: true
  dry-run:
    description: >
      Run the deployment without committing or tagging in the WordPress.org Subversion repository.

      The commit and tag commands are printed but not executed, all other steps and checks run as usual.
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Install Subversion
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y subversion

    - name: Install Composer dependencies
      shell: bash
      run: composer install --no-dev --no-interaction --no-progress --prefer-dist --working-dir="${{ github.action_path }}"

    - id: deploy
      run: php ${{ github.action_path }}/deploy.php
      shell: bash
      env:
        INPUT_USERNAME: ${{ inputs.username }}
        INPUT_PASSWORD: ${{ inputs.password }}
        INPUT_TAG: ${{ inputs.tag }}
        INPUT_SLUG: ${{ inputs.slug }}
        INPUT_DRY-RUN: ${{ inputs.dry-run }}
